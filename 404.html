<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Souvenirs | Tus Recuerdos Inmortales</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --primary: #6366f1;
            --accent: #6366f1;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --gradient-start: rgba(99, 102, 241, 0.15);
            --card-bg: rgba(255, 255, 255, 0.03);
            --glass: rgba(255, 255, 255, 0.05);
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* Hero Glow Background */
        body::before {
            content: '';
            position: fixed;
            top: -10%; left: 0; right: 0; height: 120vh;
            background: radial-gradient(circle at 50% 0%, var(--gradient-start) 0%, transparent 80%);
            z-index: -1;
            pointer-events: none;
            transition: background 1s ease;
        }

        header {
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            z-index: 100;
        }

        .header-content {
            display: inline-block;
            animation: slideDown 0.8s ease;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 900;
            margin: 0;
            letter-spacing: -0.05em;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .album-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* High Fidelity Gallery Grid */
        .gallery-wrapper {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(4, 1fr); gap: 24px; } }
        @media (min-width: 1200px) { .gallery { grid-template-columns: repeat(6, 1fr); gap: 30px; } }

        .media-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(20px);
        }

        .media-item.show { opacity: 1; transform: translateY(0); }

        .media-item:hover {
            transform: scale(1.04) translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px var(--gradient-start);
            z-index: 2;
        }

        .media-item img, .media-item video {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .media-item:hover img, .media-item:hover video { transform: scale(1.1); }

        .video-tag {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Immersive Pro Viewer */
        #viewer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Blur Backdrop Effect */
        #viewer-backdrop {
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-size: cover;
            background-position: center;
            filter: blur(80px) brightness(0.4);
            opacity: 0.6;
            z-index: -1;
            transition: background-image 0.5s ease;
        }

        .viewer-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            z-index: 1020;
        }

        .viewer-controls {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem;
            pointer-events: none;
            z-index: 1015;
        }

        .v-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        .v-btn:hover { background: var(--primary); transform: scale(1.1); }
        .v-btn:active { transform: scale(0.9); }

        .close-x { font-size: 1.5rem; font-weight: 300; }

        .viewer-content {
            max-width: 100vw;
            max-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 1010;
        }

        .viewer-content img, .viewer-content video {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .viewer-info {
            position: absolute;
            bottom: 2rem;
            left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
            z-index: 1020;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Skeleton & Loader */
        .loader {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }

        /* Error Styles */
        .error-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; padding: 3rem; text-align: center;
        }

        .btn-premium {
            margin-top: 2rem;
            padding: 1.2rem 2.5rem;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            text-decoration: none;
            border-radius: 100px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.3);
            transition: var(--transition);
        }

        .btn-premium:hover { transform: translateY(-3px); box-shadow: 0 20px 45px rgba(99, 102, 241, 0.5); }

    </style>
</head>
<body id="body">

    <header>
        <div class="header-content">
            <h1 id="albumTitle">NFC Souvenirs</h1>
            <div class="album-subtitle" id="albumSubtitle">Galería de Recuerdos</div>
        </div>
    </header>

    <main class="gallery-wrapper">
        <div id="loader" class="loader"></div>
        <div id="gallery" class="gallery"></div>
        
        <div id="error" class="error-state" style="display:none;">
            <h2 id="errorMsgTitle" style="font-family: 'Outfit', sans-serif; font-size: 2rem;">¡Vaya! Algo pasó</h2>
            <p id="errorMsg" style="color: var(--text-muted); max-width: 400px; margin-top: 1rem;"></p>
            <a href="https://play.google.com/store/apps/details?id=com.tusouvenir.app" class="btn-premium">Abrir en la App</a>
        </div>
    </main>

    <!-- Professional Inmersive Viewer -->
    <div id="viewer">
        <div id="viewer-backdrop"></div>
        
        <div class="viewer-header">
            <span style="font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: 0.1em; opacity: 0.8;">MEMORIA</span>
            <button class="v-btn close-x" onclick="closeViewer()">✕</button>
        </div>
        
        <div class="viewer-controls">
            <button class="v-btn" onclick="changeMedia(-1)">❮</button>
            <button class="v-btn" onclick="changeMedia(1)">❯</button>
        </div>
        
        <div class="viewer-content" id="viewer-content"></div>
        
        <div class="viewer-info" id="mediaInfo">1 / 1</div>
    </div>

    <script>
        const SUPABASE_URL = "https://apknmsbrbmtjidmrngnk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1ZymSc3eQia5scNC2mmWXw_ke1Wlppb";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let albumMedia = [];
        let currentIdx = 0;
        let touchStartX = 0;

        async function init() {
            const uuid = window.location.pathname.split('/').pop();
            
            if (!uuid || uuid.length < 30) {
                showError("Escanea un souvenir NFC para ver la magia.", "Sin conexión activa");
                return;
            }

            try {
                const { data: tag, error } = await supabaseClient
                    .from('tags')
                    .select('status, album_id, albums(title, is_published, use_category_style, categories(style_json), media(url, type, order_index))')
                    .eq('uuid', uuid)
                    .maybeSingle();

                if (error || !tag) {
                    showError("Este recuerdo aún no ha sido inmortalizado.", "No encontrado");
                    return;
                }

                if (tag.status === 'unassigned' || !tag.album_id) {
                    document.getElementById('albumTitle').innerText = "Nuevo Souvenir";
                    showError("Este imán está listo para guardar tus fotos. ¡Vincúlalo en la App!", "Pendiente de vínculo");
                    return;
                }

                const album = tag.albums;
                if (!album) {
                    showError("El dueño ha puesto este álbum en modo privado.", "Acceso restringido");
                    return;
                }

                // Apply Dynamic Styles
                if (album.use_category_style && album.categories?.style_json) {
                    const s = album.categories.style_json;
                    document.documentElement.style.setProperty('--gradient-start', s.gradientStart + '44');
                    document.documentElement.style.setProperty('--primary', s.accentColor || s.gradientStart);
                    document.documentElement.style.setProperty('--accent', s.accentColor || s.gradientStart);
                }

                document.getElementById('albumTitle').innerText = album.title;
                albumMedia = (album.media || []).sort((a, b) => a.order_index - b.order_index);
                
                renderGallery();

            } catch (e) {
                showError("No pudimos conectar con la nube. Revisa tu conexión.", "Error de red");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function renderGallery() {
            const container = document.getElementById('gallery');
            if (albumMedia.length === 0) {
                showError("El álbum está vinculado pero aún no tiene fotos subidas.", "Galería vacía");
                return;
            }

            albumMedia.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'media-item';
                el.style.transitionDelay = `${index * 0.05}s`;
                el.onclick = () => openViewer(index);

                if (item.type === 'video') {
                    const v = document.createElement('video');
                    v.src = item.url + "#t=0.5";
                    v.muted = true; v.playsInline = true;
                    el.appendChild(v);
                    const tag = document.createElement('div');
                    tag.className = 'video-tag';
                    tag.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
                    el.appendChild(tag);
                } else {
                    const img = document.createElement('img');
                    img.src = item.url; img.loading = "lazy";
                    el.appendChild(img);
                }
                container.appendChild(el);
                
                // Trigger animation
                setTimeout(() => el.classList.add('show'), 100);
            });
        }

        function openViewer(index) {
            currentIdx = index;
            updateViewer();
            document.getElementById('viewer').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function updateViewer() {
            const item = albumMedia[currentIdx];
            const content = document.getElementById('viewer-content');
            const backdrop = document.getElementById('viewer-backdrop');
            const info = document.getElementById('mediaInfo');

            content.innerHTML = '';
            info.innerText = `${currentIdx + 1} / ${albumMedia.length}`;
            
            if (item.type === 'video') {
                const v = document.createElement('video');
                v.src = item.url; v.controls = true; v.autoplay = true;
                content.appendChild(v);
                backdrop.style.backgroundImage = 'none';
                backdrop.style.backgroundColor = '#000';
            } else {
                const img = document.createElement('img');
                img.src = item.url;
                content.appendChild(img);
                backdrop.style.backgroundImage = `url(${item.url})`;
            }
        }

        function changeMedia(dir) {
            currentIdx = (currentIdx + dir + albumMedia.length) % albumMedia.length;
            updateViewer();
        }

        function closeViewer() {
            document.getElementById('viewer').style.display = 'none';
            document.getElementById('viewer-content').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        // Gestures & Keyboard
        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeViewer();
            if (e.key === 'ArrowRight') changeMedia(1);
            if (e.key === 'ArrowLeft') changeMedia(-1);
        });

        const v = document.getElementById('viewer');
        v.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        v.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) changeMedia(diff > 0 ? 1 : -1);
        });

        function showError(msg, title) {
            document.getElementById('errorMsg').innerText = msg;
            document.getElementById('errorMsgTitle').innerText = title;
            document.getElementById('error').style.display = 'flex';
            document.getElementById('gallery').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
