<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Souvenirs | Gestiona tus Recuerdos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --primary: #6366f1;
            --accent: #a855f7;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(255, 255, 255, 0.03);
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 80%);
            z-index: -1; pointer-events: none;
        }

        /* --- Auth View --- */
        #auth-view {
            flex: 1; display: none; align-items: center; justify-content: center; padding: 2rem;
        }

        .auth-card {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-lg);
            padding: 3rem 2rem; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .auth-logo {
            width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 18px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .auth-card h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 0.5rem; }
        .auth-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

        .form-group { text-align: left; margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .form-group input {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 0.8rem 1rem; color: white; font-family: inherit; font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus { border-color: var(--primary); background: rgba(0,0,0,0.4); outline: none; }

        .btn-auth {
            width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none; border-radius: 12px; color: white; font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: var(--transition);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); }
        .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }

        .auth-toggle { margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .auth-toggle span { color: var(--primary); cursor: pointer; font-weight: 600; }

        /* --- App View --- */
        #app-view { flex: 1; display: none; flex-direction: column; }

        nav {
            padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
        }
        .nav-logo { display: flex; align-items: center; gap: 0.8rem; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem; }
        .nav-logo div { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 8px; }

        .user-actions { display: flex; gap: 1rem; align-items: center; }
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: var(--transition); }
        .btn-logout:hover { background: rgba(255,255,255,0.05); color: white; }

        .content { max-width: 1200px; width: 100%; margin: 0 auto; padding: 2rem; }

        .dashboard-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; }
        .dashboard-header h2 { font-family: 'Outfit', sans-serif; font-size: 2.5rem; font-weight: 900; letter-spacing: -0.04em; }

        .btn-add {
            background: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 12px;
            font-family: 'Outfit', sans-serif; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); transition: var(--transition);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); }

        /* Album Grid */
        .albums-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        
        .album-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-md);
            overflow: hidden; transition: var(--transition); cursor: pointer; position: relative;
        }
        .album-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(255,255,255,0.05); }

        .album-cover { width: 100%; aspect-ratio: 16/9; background: #1a1c23; position: relative; overflow: hidden; }
        .album-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .album-card:hover .album-cover img { transform: scale(1.05); }
        .no-cover { display: flex; align-items: center; justify-content: center; height: 100%; color: rgba(255,255,255,0.1); }

        .album-info { padding: 1.2rem; }
        .album-info h3 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; margin-bottom: 0.3rem; }
        .album-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .status-active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }

        /* Loader */
        .loader-full { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-dark); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .dashboard-header h2 { font-size: 2rem; }
            .content { padding: 1rem; }
        }
    </style>
</head>
<body>

    <div id="loader" class="loader-full"><div class="spinner"></div></div>

    <!-- Auth View -->
    <div id="auth-view">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v12M6 12h12"/></svg>
            </div>
            <h2 id="auth-title">Bienvenido</h2>
            <p id="auth-desc">Entra para gestionar tus recuerdos físicos.</p>

            <form id="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-auth" id="btn-submit">Entrar</button>
            </form>

            <div class="auth-toggle">
                <span id="toggle-text">¿No tienes cuenta? Regístrate</span>
            </div>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view">
        <nav>
            <div class="nav-logo">
                <div></div>
                <span>NFC Souvenirs</span>
            </div>
            <div class="user-actions">
                <span id="user-email" style="font-size: 0.8rem; color: var(--text-muted); display: none;"></span>
                <button class="btn-logout" id="logout-btn">Cerrar Sesión</button>
            </div>
        </nav>

        <main class="content">
            <div class="dashboard-header">
                <div>
                    <h2>Mis Recuerdos</h2>
                    <p style="color: var(--text-muted);">Gestiona tus imanes y álbumes</p>
                </div>
                <!-- Nota: En web no hay escaneo NFC directo fácilmente, pero podemos dejar un botón para añadir vía UUID si se conoce -->
                <button class="btn-add" onclick="alert('Funcionalidad próximamente: Vincular nuevo imán vía código UUID')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nuevo Álbum
                </button>
            </div>

            <div id="albums-container" class="albums-grid">
                <!-- Albums load here -->
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://apknmsbrbmtjidmrngnk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1ZymSc3eQia5scNC2mmWXw_ke1Wlppb";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isSignUp = false;

        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                showApp(session.user);
            } else {
                showAuth();
            }
            hideLoader();
        }

        function showAuth() {
            document.getElementById('auth-view').style.display = 'flex';
            document.getElementById('app-view').style.display = 'none';
        }

        async function showApp(user) {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'flex';
            document.getElementById('user-email').innerText = user.email;
            document.getElementById('user-email').style.display = 'block';
            loadAlbums();
        }

        async function loadAlbums() {
            const container = document.getElementById('albums-container');
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Cargando tus álbumes...</p>';

            try {
                const { data: albums, error } = await supabase
                    .from('albums')
                    .select('*, categories(name)')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (albums.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 4rem; background: var(--card-bg); border-radius: 20px; border: 1px dashed rgba(255,255,255,0.1);">Aún no has creado ningún álbum. ¡Vincula tu primer imán!</p>';
                    return;
                }

                container.innerHTML = '';
                albums.forEach(album => {
                    const card = document.createElement('div');
                    card.className = 'album-card';
                    card.onclick = () => window.location.href = `m/${album.id}`; // Redirigir al visor
                    
                    const isPub = album.is_published;
                    
                    card.innerHTML = `
                        <div class="album-cover">
                            ${album.cover_url ? `<img src="${album.cover_url}" alt="${album.title}">` : `<div class="no-cover"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></div>`}
                        </div>
                        <div class="album-info">
                            <h3>${album.title}</h3>
                            <div class="album-meta">
                                <span>${album.categories ? album.categories.name : 'Sin categoría'}</span>
                                <span class="status-pill ${isPub ? 'status-active' : 'status-pending'}">${isPub ? 'Liberado' : 'Bloqueado'}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (e) {
                container.innerHTML = `<p style="color: #ef4444;">Error al cargar: ${e.message}</p>`;
            }
        }

        // --- Event Listeners ---
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            
            btn.disabled = true;
            btn.innerText = isSignUp ? 'Registrando...' : 'Entrando...';

            try {
                if (isSignUp) {
                    const { error } = await supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('¡Registro exitoso! Revisa tu email para confirmar.');
                } else {
                    const { error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    window.location.reload();
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = isSignUp ? 'Registrarme' : 'Entrar';
            }
        });

        document.getElementById('toggle-text').addEventListener('click', () => {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? 'Crea tu Cuenta' : 'Bienvenido';
            document.getElementById('auth-desc').innerText = isSignUp ? 'Empieza a inmortalizar tus recuerdos hoy.' : 'Entra para gestionar tus recuerdos físicos.';
            document.getElementById('btn-submit').innerText = isSignUp ? 'Registrarme' : 'Entrar';
            document.getElementById('toggle-text').innerText = isSignUp ? '¿Ya tienes cuenta? Entra aquí' : '¿No tienes cuenta? Regístrate';
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        init();
    </script>
</body>
</html>
