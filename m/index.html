<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC Souvenirs | Tus Recuerdos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0F19;
            --primary: #6366f1;
            --accent: #a855f7;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --gradient-start: rgba(99, 102, 241, 0.15);
            --card-bg: rgba(255, 255, 255, 0.03);
            --radius-md: 16px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; height: 100vh;
            background: radial-gradient(circle at top center, var(--gradient-start) 0%, transparent 80%);
            z-index: -1; pointer-events: none;
        }

        header { padding: 3.5rem 1.5rem 2rem; text-align: center; }
        h1 { font-family: 'Outfit', sans-serif; font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); letter-spacing: 0.25em; text-transform: uppercase; font-weight: 600; }

        .gallery-wrapper { max-width: 1400px; width: 100%; margin: 0 auto; padding: 0 1rem 5rem; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .media-item {
            aspect-ratio: 1/1; border-radius: var(--radius-md); overflow: hidden;
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer; transition: var(--transition); opacity: 0; transform: translateY(15px);
        }
        .media-item.show { opacity: 1; transform: translateY(0); }
        .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }

        /* --- Protected View --- */
        #protected-view { display: none; text-align: center; padding: 4rem 2rem; max-width: 400px; margin: 0 auto; }
        .lock-icon { font-size: 4rem; margin-bottom: 1.5rem; }
        .btn-request {
            width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none; border-radius: 12px; color: white; font-family: 'Outfit', sans-serif;
            font-weight: 700; cursor: pointer; margin-top: 2rem;
        }

        /* --- Viewer --- */
        #viewer { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; align-items: center; justify-content: center; }
        .v-content img, .v-content video { max-width: 100%; max-height: 90vh; object-fit: contain; }
        .v-close { position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,0.1); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

        .loader { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1 id="albumTitle">NFC Souvenirs</h1>
        <div class="subtitle" id="albumSubtitle">Tus Recuerdos</div>
    </header>

    <main class="gallery-wrapper">
        <div id="loader" class="loader"></div>
        
        <!-- Gallery View -->
        <div id="gallery" class="gallery"></div>

        <!-- Protected View -->
        <div id="protected-view">
            <div class="lock-icon">🛡️</div>
            <h3>Recuerdo Protegido</h3>
            <p style="color:var(--text-muted); margin-top:1rem;">Este álbum es privado. Solicita acceso al dueño para ver el contenido.</p>
            <button class="btn-request" id="btn-request" onclick="requestAccess()">Solicitar Acceso</button>
            <div id="request-status" style="margin-top:1.5rem; font-weight:600; display:none;">Solicitud enviada. Espera aprobación.</div>
        </div>
    </main>

    <div id="viewer">
        <button class="v-close" onclick="closeViewer()">✕</button>
        <div class="v-content" id="v-content"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://apknmsbrbmtjidmrngnk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1ZymSc3eQia5scNC2mmWXw_ke1Wlppb";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let mediaItems = [];
        let albumId = null;

        async function init() {
            const uuid = window.location.pathname.split('/').pop();
            if (!uuid || uuid.length < 30) return;

            try {
                // Consulta unificada como en 404.html
                const { data: tag } = await supabase.from('tags').select('album_id, albums(title, is_published, media(url, type, order_index))').eq('uuid', uuid).single();
                
                if (!tag || !tag.album_id) {
                    document.getElementById('albumTitle').innerText = "Vacío";
                    document.getElementById('albumSubtitle').innerText = "Este recuerdo no tiene contenido o fue eliminado.";
                    return;
                }
                
                albumId = tag.album_id;

                if (tag.albums) {
                    const album = tag.albums;
                    document.getElementById('albumTitle').innerText = album.title;
                    mediaItems = (album.media || []).sort((a,b) => a.order_index - b.order_index);
                    render();
                } else {
                    // Album is null because RLS blocked it, or it was deleted without unlinking.
                    showProtected();
                }
            } catch (e) {
                console.error(e);
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function render() {
            const g = document.getElementById('gallery');
            mediaItems.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'media-item';
                el.style.transitionDelay = `${i * 0.04}s`;
                el.onclick = () => openViewer(i);

                if (item.type === 'video') {
                    const v = document.createElement('video');
                    v.src = item.url + "#t=0.5";
                    v.muted = true; v.playsInline = true;
                    el.appendChild(v);
                } else {
                    const img = document.createElement('img');
                    img.src = item.url; img.loading = "lazy";
                    el.appendChild(img);
                }
                g.appendChild(el);
                setTimeout(() => el.classList.add('show'), 50);
            });
        }

        function showProtected() {
            document.getElementById('gallery').style.display = 'none';
            document.getElementById('protected-view').style.display = 'block';
        }

        async function requestAccess() {
            const btn = document.getElementById('btn-request');
            btn.disabled = true;
            btn.innerText = "Enviando...";
            
            // In a real app, we might ask for user's name/email. 
            // Here we just insert a record if the table exists.
            const { error } = await supabase.from('pending_requests').insert({ album_id: albumId, status: 'pending' });
            
            if (error) {
                alert("Error al enviar solicitud: " + error.message);
                btn.disabled = false;
                btn.innerText = "Solicitar Acceso";
            } else {
                btn.style.display = 'none';
                document.getElementById('request-status').style.display = 'block';
            }
        }

        function openViewer(i) {
            const item = mediaItems[i];
            const c = document.getElementById('v-content');
            c.innerHTML = '';
            if (item.type === 'video') {
                const v = document.createElement('video');
                v.src = item.url; v.controls = true; v.autoplay = true;
                c.appendChild(v);
            } else {
                const img = document.createElement('img');
                img.src = item.url;
                c.appendChild(img);
            }
            document.getElementById('viewer').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('viewer').style.display = 'none';
            document.getElementById('v-content').innerHTML = '';
        }

        window.onload = init;
    </script>
</body>
</html>
